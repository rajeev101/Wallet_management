# ==============================================================================
# Nginx Configuration for Campus Wallet (Single Domain or Server IP)
# Place in: /etc/nginx/sites-available/campus-wallet
# Enable with: ln -s /etc/nginx/sites-available/campus-wallet /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace with your domain name or VPS IP address
    server_name _;

    client_max_body_size 20M;

    # 1. API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Admin Dashboard Frontend (/admin)
    location /admin {
        alias /var/www/wallet/admin/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 3. Client Frontend (Student & Vendor Portal at /)
    location / {
        root /var/www/wallet/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
